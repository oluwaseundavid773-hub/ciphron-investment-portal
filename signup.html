<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Investor Account | CIPHRON</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            500: '#10b981',
                            600: '#059669',
                            dark: '#0f172a',
                            card: '#1e293b',
                            border: '#334155'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; }</style>
</head>
<body class="bg-brand-dark text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-brand-card border border-brand-border rounded-2xl p-6 sm:p-8 shadow-2xl space-y-6">
        
        <!-- Header / Logo -->
        <div class="text-center space-y-2">
            <a href="index.html" class="inline-flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center shadow-lg shadow-emerald-500/20">
                    <i class="fa-solid fa-shield-halved text-slate-950 text-xl font-bold"></i>
                </div>
                <span class="font-bold text-xl tracking-wider text-white">CIPHRON</span>
            </a>
            <h2 class="text-xl font-bold text-white pt-2">Create Treasury Account</h2>
            <p class="text-xs text-slate-400">Institutional-grade yield & asset management</p>
        </div>

        <!-- Registration Form -->
        <form id="signupForm" class="space-y-4">
            <div>
                <label class="block text-xs text-slate-300 font-medium mb-1.5">Full Legal Name</label>
                <input type="text" id="signupName" required placeholder="John Doe" class="w-full bg-slate-950 border border-brand-border rounded-xl py-3 px-4 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>

            <div>
                <label class="block text-xs text-slate-300 font-medium mb-1.5">Email Address</label>
                <input type="email" id="signupEmail" required placeholder="investor@example.com" class="w-full bg-slate-950 border border-brand-border rounded-xl py-3 px-4 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>

            <div>
                <label class="block text-xs text-slate-300 font-medium mb-1.5">Password</label>
                <input type="password" id="signupPassword" required placeholder="••••••••••••" class="w-full bg-slate-950 border border-brand-border rounded-xl py-3 px-4 text-sm text-white focus:outline-none focus:border-emerald-500">
            </div>

            <!-- FACE VERIFICATION / BIOMETRIC LIVENESS BLOCK -->
            <div class="bg-slate-950 border border-brand-border p-4 rounded-xl space-y-3">
                <div class="flex items-center justify-between">
                    <label class="text-xs font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-face-smile text-emerald-400"></i> Face Verification (Liveness Check)
                    </label>
                    <span id="faceStatusBadge" class="text-[10px] font-semibold bg-amber-500/10 text-amber-400 px-2 py-0.5 rounded border border-amber-500/20">Action Required</span>
                </div>
                <p class="text-[11px] text-slate-400">Required for multi-factor security and fast-track withdrawal approval.</p>
                
                <div id="facePreviewContainer" class="hidden relative w-full h-40 bg-slate-900 rounded-lg overflow-hidden border border-brand-border items-center justify-center">
                    <video id="webcamVideo" autoplay playsinline class="w-full h-full object-cover"></video>
                    <div id="scanOverlay" class="absolute inset-0 border-2 border-dashed border-emerald-400/70 rounded-lg pointer-events-none flex items-center justify-center">
                        <span class="text-[10px] bg-slate-950/80 text-emerald-400 px-2 py-1 rounded">Align Face In Frame</span>
                    </div>
                </div>

                <button type="button" id="btnScanFace" onclick="startFaceVerification()" class="w-full bg-slate-800 hover:bg-slate-700 text-emerald-400 border border-brand-border py-2.5 rounded-xl text-xs font-bold transition flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-camera"></i>
                    <span id="scanBtnText">Scan Live Face ID</span>
                </button>
            </div>

            <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold py-3.5 rounded-xl transition shadow-lg shadow-emerald-500/20 text-sm cursor-pointer mt-2">
                Create Account & Proceed
            </button>
        </form>

        <div class="text-center text-xs text-slate-400 pt-2 border-t border-brand-border/60">
            Already have an investor account? 
            <a href="signin.html" class="text-emerald-400 hover:underline font-semibold ml-1">Sign In</a>
        </div>
    </div>

    <!-- Unified JavaScript Logic -->
    <script>
        // Local testing -> backend on port 5000. Live site -> same domain (Vercel).
        const API_URL = ['localhost', '127.0.0.1'].includes(location.hostname)
            ? 'http://localhost:5000'
            : '';

        let faceVerified = false;
        let videoStream = null;

        async function startFaceVerification() {
            const container = document.getElementById('facePreviewContainer');
            const video = document.getElementById('webcamVideo');
            const badge = document.getElementById('faceStatusBadge');
            const btnText = document.getElementById('scanBtnText');

            if (faceVerified) {
                alert('Face verification has already been completed!');
                return;
            }

            try {
                videoStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                video.srcObject = videoStream;
                container.classList.remove('hidden');
                container.classList.add('flex');
                
                btnText.textContent = "Analyzing Biometrics...";
                badge.className = "text-[10px] font-semibold bg-blue-500/10 text-blue-400 px-2 py-0.5 rounded border border-blue-500/20";
                badge.textContent = "Scanning...";

                setTimeout(() => {
                    faceVerified = true;
                    stopWebcam();
                    container.classList.add('hidden');
                    container.classList.remove('flex');

                    badge.className = "text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/20";
                    badge.textContent = "Face ID Verified";
                    btnText.textContent = "Verification Complete ✓";
                    document.getElementById('btnScanFace').classList.add('opacity-70');
                }, 3500);

            } catch (err) {
                alert('Camera access denied or unavailable. Fallback: Automated simulation running.');
                setTimeout(() => {
                    faceVerified = true;
                    badge.className = "text-[10px] font-semibold bg-emerald-500/10 text-emerald-400 px-2 py-0.5 rounded border border-emerald-500/20";
                    badge.textContent = "Face ID Verified";
                    btnText.textContent = "Verification Complete ✓";
                }, 1500);
            }
        }

        function stopWebcam() {
            if (videoStream) {
                videoStream.getTracks().forEach(track => track.stop());
            }
        }

        // Main unified form submit listener connecting to backend API
        const signupForm = document.getElementById('signupForm');

        if (signupForm) {
            signupForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                if (!faceVerified) {
                    alert('⚠️ Biometric Face Verification Required!\n\nPlease complete the live face scan before creating your account.');
                    return;
                }

                const name = document.getElementById('signupName').value;
                const email = document.getElementById('signupEmail').value;
                const password = document.getElementById('signupPassword').value;

                try {
                    const response = await fetch(`${API_URL}/api/auth/signup`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ name, email, password }),
                    });

                    // Safe parse: avoids "Unexpected end of JSON input" on empty replies
                    const text = await response.text();
                    const data = text ? JSON.parse(text) : {};

                    if (response.ok && data.token) {
                        // Save JWT token & redirect to dashboard
                        localStorage.setItem('ciphron_token', data.token);
                        alert('🎉 Account Created Successfully!');
                        window.location.href = 'dashboard.html';
                    } else {
                        alert(data.error || `Signup failed (status ${response.status}). Please try again.`);
                    }
                } catch (err) {
                    console.error('Signup error:', err);
                    alert('Server unreachable. Please check your network connection.');
                }
            });
        }
    </script>
</body>
</html>
