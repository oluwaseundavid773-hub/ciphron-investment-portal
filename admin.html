<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Treasury Control | Ciphron Investment & Finance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            500: '#10b981',
                            600: '#059669',
                            dark: '#0f172a',
                            card: '#1e293b',
                            border: '#334155'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-brand-dark text-slate-100 flex h-screen overflow-hidden">

    <aside class="w-64 bg-slate-900 border-r border-brand-border flex flex-col h-full">
        <div class="p-6 flex items-center space-x-3 border-b border-brand-border">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-emerald-500 to-teal-400 flex items-center justify-center">
                <i class="fa-solid fa-user-shield text-slate-950 font-bold"></i>
            </div>
            <div>
                <h1 class="font-bold text-white tracking-wider">CIPHRON</h1>
                <p class="text-xs text-amber-400 font-bold uppercase">Admin Treasury</p>
            </div>
        </div>
        <nav class="p-4 space-y-2">
            <a href="#" class="flex items-center space-x-3 px-4 py-3 rounded-xl bg-emerald-500/10 text-emerald-400 font-semibold border border-emerald-500/20">
                <i class="fa-solid fa-vault"></i>
                <span>Deposit Approvals</span>
            </a>
            <a href="dashboard.html" class="flex items-center space-x-3 px-4 py-3 rounded-xl text-slate-400 hover:text-white transition">
                <i class="fa-solid fa-chart-pie"></i>
                <span>Investor Dashboard</span>
            </a>
        </nav>
    </aside>

    <div class="flex-1 flex flex-col h-screen overflow-y-auto">
        <header class="h-20 bg-slate-900/80 border-b border-brand-border px-8 flex items-center justify-between">
            <h2 class="text-xl font-bold text-white">Incoming Client Deposits & Vault Control</h2>
            <span class="px-3 py-1 bg-amber-500/10 text-amber-400 border border-amber-500/20 rounded-xl text-xs font-bold">
                Manual Authorization Desk
            </span>
        </header>

        <main class="p-8 space-y-6 max-w-7xl mx-auto w-full">
            <div class="bg-brand-card border border-brand-border rounded-2xl p-6 space-y-4">
                <div class="flex justify-between items-center border-b border-brand-border/60 pb-4">
                    <div>
                        <h3 class="text-lg font-bold text-white">Pending Client Deposit Queue</h3>
                        <p class="text-xs text-slate-400">Review incoming payments and approve them to credit client dashboards.</p>
                    </div>
                    <button onclick="loadPendingDeposits()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-3 py-1.5 rounded-lg text-xs font-bold transition">
                        <i class="fa-solid fa-rotate-right mr-1"></i> Refresh Queue
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs text-slate-300">
                        <thead class="bg-slate-950 text-slate-400 uppercase text-[10px] font-bold border-b border-brand-border">
                            <tr>
                                <th class="p-3.5">Investor</th>
                                <th class="p-3.5">Amount ($ USD)</th>
                                <th class="p-3.5">Selected Plan</th>
                                <th class="p-3.5">Daily ROI Rate</th>
                                <th class="p-3.5 text-right">Action</th>
                            </tr>
                        </thead>
                        <tbody id="depositTableBody" class="divide-y divide-brand-border/60">
                            <!-- Injected dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script>
        function loadPendingDeposits() {
            const tableBody = document.getElementById('depositTableBody');
            let pendingQueue = JSON.parse(localStorage.getItem('ciphron_pending_deposits')) || [];

            if (pendingQueue.length === 0) {
                tableBody.innerHTML = `
                    <tr>
                        <td colspan="5" class="p-8 text-center text-slate-500 font-medium">
                            No pending deposits found in the queue.
                        </td>
                    </tr>
                `;
                return;
            }

            tableBody.innerHTML = '';
            pendingQueue.forEach((dep, index) => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-800/40 transition';
                tr.innerHTML = `
                    <td class="p-3.5 font-bold text-white">
                        ${dep.userName}
                        <span class="block text-[10px] text-slate-400 font-normal">${dep.userEmail}</span>
                    </td>
                    <td class="p-3.5 font-extrabold text-emerald-400">$${dep.amount.toLocaleString()}.00 USD</td>
                    <td class="p-3.5 text-slate-200 font-semibold">${dep.planName}</td>
                    <td class="p-3.5 text-amber-400 font-bold">+${dep.dailyRate}% / Day</td>
                    <td class="p-3.5 text-right space-x-2">
                        <button onclick="approveDeposit(${index})" class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-3 py-1.5 rounded-lg text-xs transition cursor-pointer">
                            Approve Deposit
                        </button>
                        <button onclick="rejectDeposit(${index})" class="bg-slate-800 hover:bg-red-500/20 text-slate-400 hover:text-red-400 border border-brand-border px-3 py-1.5 rounded-lg text-xs transition cursor-pointer">
                            Reject
                        </button>
                    </td>
                `;
                tableBody.appendChild(tr);
            });
        }

        function approveDeposit(index) {
            let pendingQueue = JSON.parse(localStorage.getItem('ciphron_pending_deposits')) || [];
            let approvedItem = pendingQueue[index];

            if (!approvedItem) return;

            // Load Users DB
            let savedUsers = JSON.parse(localStorage.getItem('ciphron_users_db')) || {};
            let user = savedUsers[approvedItem.userEmail] || {
                name: approvedItem.userName,
                email: approvedItem.userEmail,
                stakedCapital: 0,
                unlockedBalance: 0,
                totalProfit: 0,
                totalCashouts: 0,
                planName: approvedItem.planName,
                dailyRate: approvedItem.dailyRate
            };

            // Update capital & plan details
            user.stakedCapital += approvedItem.amount;
            user.planName = approvedItem.planName;
            user.dailyRate = approvedItem.dailyRate;

            // Save back to DB
            savedUsers[approvedItem.userEmail] = user;
            localStorage.setItem('ciphron_users_db', JSON.stringify(savedUsers));

            // Sync active session if logged in
            let activeUser = JSON.parse(localStorage.getItem('ciphron_active_user'));
            if (activeUser && activeUser.email === approvedItem.userEmail) {
                localStorage.setItem('ciphron_active_user', JSON.stringify(user));
            }

            // Remove item from queue
            pendingQueue.splice(index, 1);
            localStorage.setItem('ciphron_pending_deposits', JSON.stringify(pendingQueue));

            alert('✅ Deposit Approved!\n\n$' + approvedItem.amount + ' USD has been funded into ' + approvedItem.userName + '\'s account. Daily percentage growth is now activated!');
            loadPendingDeposits();
        }

        function rejectDeposit(index) {
            let pendingQueue = JSON.parse(localStorage.getItem('ciphron_pending_deposits')) || [];
            pendingQueue.splice(index, 1);
            localStorage.setItem('ciphron_pending_deposits', JSON.stringify(pendingQueue));
            loadPendingDeposits();
        }

        document.addEventListener('DOMContentLoaded', loadPendingDeposits);
    </script>
</body>
</html>
